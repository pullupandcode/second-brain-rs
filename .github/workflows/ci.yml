name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # Nightly is installed last and becomes the default toolchain, so pin
      # clippy/test to stable explicitly; nightly is only for rustfmt.
      - name: fmt
        run: cargo +nightly fmt --all -- --check
      - name: clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo +stable test --all-features

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked
      - name: deny
        run: cargo deny check
      - name: audit
        run: cargo audit

  windows-storage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: storage replacements and path validation
        run: cargo +stable test --locked --test storage --test storage_review --test audit_recovery
      - name: archive collision and cleanup
        run: cargo +stable test --locked --lib vault::audit::recovery_tests

  release-plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Release automation regression tests
        run: python -m unittest discover -s tests/release -v
      - name: Validate version and determine release
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/release.py plan --base "$BASE_SHA"

  release-build:
    needs: release-plan
    if: needs.release-plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: ''
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            extension: ''
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: ''
            archive: tar.gz
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            extension: .exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build optimized native executable
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +stable build --release --locked --target "$TARGET" --bin second-brain-rs
      - name: Package and smoke-test the downloadable executable
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          ARCHIVE: second-brain-rs-v${{ needs.release-plan.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
        run: |
          python scripts/package_release.py package --target "$TARGET" --binary "target/$TARGET/release/second-brain-rs$EXTENSION" --out dist
          python scripts/package_release.py smoke --archive "dist/$ARCHIVE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-release:
    needs: [check, supply-chain, windows-storage, release-plan, release-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: immutable-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: python scripts/release.py publish --assets dist --sha "$RELEASE_SHA" --repository "$REPOSITORY"
