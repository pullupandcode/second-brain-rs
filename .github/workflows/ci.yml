name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # Nightly is installed last and becomes the default toolchain, so pin
      # clippy/test to stable explicitly; nightly is only for rustfmt.
      - name: fmt
        run: cargo +nightly fmt --all -- --check
      - name: clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo +stable test --all-features

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked
      - name: deny
        run: cargo deny check
      - name: audit
        run: cargo audit

  windows-storage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: storage replacements and path validation
        run: cargo +stable test --locked --test storage --test storage_review --test audit_recovery
      - name: archive collision and cleanup
        run: cargo +stable test --locked --lib vault::audit::recovery_tests
